[project]
name = "aegisqa"
version = "0.1.0"
description = "Executable spine for the AegisQA test automation orchestrator."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "robotframework>=7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["generated*", "tests*", "docs*"]
