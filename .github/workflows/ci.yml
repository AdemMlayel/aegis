name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend (tests + lint + rag + lockfile guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (dev extras)
        run: pip install -e ".[dev]"

      - name: Lockfile registry guard
        # Fails if frontend/package-lock.json resolves any dependency from a
        # non-public registry (e.g. an internal Artifactory mirror), which would
        # make a clean `npm ci` unreachable.
        run: python scripts/check_lockfile_registry.py

      - name: Lint
        run: ruff check backend tests scripts

      - name: Dependency vulnerability audit (pip-audit)
        # N7 supply-chain: fail CI on known CVEs in resolved dependencies.
        # Non-blocking on transient advisory-service errors is avoided by
        # pinning the action's own behavior to a hard failure on findings.
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner=off

      - name: Tests
        run: python -m pytest -q

      - name: RAG corpus retrieval check
        run: python scripts/verify_rag_corpus.py

  frontend:
    name: frontend (clean-room build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install (strict, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Build (tsc + vite)
        run: npm run build
