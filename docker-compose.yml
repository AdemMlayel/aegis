services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    environment:
      AEGISQA_ENV: compose
      AEGISQA_SQLITE_DB_PATH: /app/generated/storage/aegisqa.sqlite3
      AEGISQA_EXECUTION_WORKER_BACKEND: celery
      AEGISQA_CELERY_BROKER_URL: redis://redis:6379/0
      AEGISQA_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEGISQA_CELERY_FALLBACK_TO_LOCAL: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - aegis-generated:/app/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      AEGISQA_ENV: compose
      AEGISQA_SQLITE_DB_PATH: /app/generated/storage/aegisqa.sqlite3
      AEGISQA_EXECUTION_WORKER_BACKEND: celery
      AEGISQA_CELERY_BROKER_URL: redis://redis:6379/0
      AEGISQA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - aegis-generated:/app/generated
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aegis-generated:
