services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    environment:
      AEGISQA_ENV: compose
      AEGISQA_SQLITE_DB_PATH: /app/generated/storage/aegisqa.sqlite3
      AEGISQA_EXECUTION_WORKER_BACKEND: celery
      AEGISQA_CELERY_BROKER_URL: redis://:${AEGIS_REDIS_PASSWORD:-changeme}@redis:6379/0
      AEGISQA_CELERY_RESULT_BACKEND: redis://:${AEGIS_REDIS_PASSWORD:-changeme}@redis:6379/1
      AEGISQA_CELERY_FALLBACK_TO_LOCAL: "true"
    ports:
      - "8000:8000"
    # S11: no source bind-mount. The image already contains the code (COPY . .);
    # mounting the host tree over /app would (a) run un-reviewed host code in the
    # container and (b) re-introduce root-owned files. Only the named volume for
    # generated artifacts is mounted, so writes persist without exposing source.
    volumes:
      - aegis-generated:/app/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      AEGISQA_ENV: compose
      AEGISQA_SQLITE_DB_PATH: /app/generated/storage/aegisqa.sqlite3
      AEGISQA_EXECUTION_WORKER_BACKEND: celery
      AEGISQA_CELERY_BROKER_URL: redis://:${AEGIS_REDIS_PASSWORD:-changeme}@redis:6379/0
      AEGISQA_CELERY_RESULT_BACKEND: redis://:${AEGIS_REDIS_PASSWORD:-changeme}@redis:6379/1
    volumes:
      - aegis-generated:/app/generated
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # S11: require a password and do NOT publish 6379 to the host. Redis is only
    # reached over the internal compose network by api/worker; an unauthenticated
    # port mapped to the host is a trivial data-exfiltration / RCE foothold.
    command: ["redis-server", "--requirepass", "${AEGIS_REDIS_PASSWORD:-changeme}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AEGIS_REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aegis-generated:
